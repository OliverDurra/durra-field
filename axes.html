<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Durra Field axis test</title>
<style>
  :root { --bg: #0b1118; --fg: #e6edf3; --mut: #8b98a5; --ok: #3fb950; --warn: #f2cc60; --card: #131b24; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.45 -apple-system, system-ui, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 20px; margin: 4px 0 8px; }
  p { color: var(--mut); margin: 6px 0; }
  button { width: 100%; padding: 14px; font: 600 17px system-ui; border: 0; border-radius: 10px; background: #ffc400; color: #111; margin: 10px 0; }
  button:disabled { opacity: .5; }
  #step { background: var(--card); border-radius: 10px; padding: 14px; font-size: 18px; min-height: 3em; }
  #count { font: 700 34px ui-monospace, monospace; color: var(--warn); }
  pre { background: var(--card); border-radius: 10px; padding: 12px; font: 14px/1.5 ui-monospace, monospace; white-space: pre-wrap; word-break: break-word; }
</style>
</head>
<body>
<main>
  <h1>Axis test (30 s)</h1>
  <p>Finds how this phone reports rotation. Put the phone <b>flat on the ground or a table, screen up, top edge pointing away from you</b>. Do each move slowly, then leave it still until the next prompt.</p>
  <button id="go">Start</button>
  <div id="step">Ready.</div>
  <div id="count"></div>
  <pre id="out"></pre>
  <p>When it finishes, screenshot the box above and send it.</p>
</main>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const STEPS = [
  { key: "flat", secs: 4, say: "1/4 Leave it flat and still." },
  { key: "spin", secs: 6, say: "2/4 Keep it flat and spin it a quarter turn CLOCKWISE (to the right), then leave it." },
  { key: "pitch", secs: 6, say: "3/4 Lay it flat again, then lift the TOP edge until the phone stands upright on its bottom edge. Hold it there." },
  { key: "roll", secs: 6, say: "4/4 Lay it flat again, then lift the LEFT edge until it stands on its RIGHT edge. Hold it there." },
];
let cur = null;
const acc = {};
function bucket(k) { return acc[k] ??= { n: 0, gx: 0, gy: 0, gz: 0, ia: 0, ib: 0, ig: 0, nr: 0, last: -1, h0: null, h1: null, ints: [] }; }
window.addEventListener("devicemotion", (e) => {
  if (!cur) return;
  const b = bucket(cur), t = e.timeStamp / 1000;
  const g = e.accelerationIncludingGravity;
  if (g && g.x != null) { b.n++; b.gx += g.x; b.gy += g.y; b.gz += g.z; }
  const r = e.rotationRate;
  if (r && r.alpha != null) {
    const dt = b.last < 0 ? 0 : Math.min(0.2, t - b.last); b.last = t;
    b.ia += r.alpha * dt; b.ib += r.beta * dt; b.ig += r.gamma * dt; b.nr++;
  }
  if (e.interval != null && b.ints.length < 3) b.ints.push(e.interval);
});
window.addEventListener("deviceorientation", (e) => {
  if (!cur) return;
  const b = bucket(cur), h = typeof e.webkitCompassHeading === "number" ? e.webkitCompassHeading : null;
  if (h === null) return;
  if (b.h0 === null) b.h0 = h; b.h1 = h;
});
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
$("go").addEventListener("click", async () => {
  $("go").disabled = true;
  const asks = [window.DeviceMotionEvent, window.DeviceOrientationEvent].filter((E) => E && E.requestPermission).map((E) => E.requestPermission());
  try { if ((await Promise.all(asks)).some((r) => r !== "granted")) { $("step").textContent = "Permission denied. Close the tab, reopen and tap Allow."; return; } }
  catch (err) { $("step").textContent = "Permission error: " + err.message; return; }
  for (const s of STEPS) {
    $("step").textContent = s.say; cur = s.key;
    for (let i = s.secs; i > 0; i--) { $("count").textContent = i; await sleep(1000); }
  }
  cur = null; $("count").textContent = ""; $("step").textContent = "Done. Screenshot the box below.";
  const f = (v) => (v >= 0 ? "+" : "") + v.toFixed(0);
  const lines = [];
  const fl = bucket("flat");
  lines.push(`gravity flat: x ${(fl.gx / fl.n || 0).toFixed(1)} y ${(fl.gy / fl.n || 0).toFixed(1)} z ${(fl.gz / fl.n || 0).toFixed(1)}  (n ${fl.n})`);
  for (const k of ["spin", "pitch", "roll"]) {
    const b = bucket(k);
    const end = b.n ? `  g end ~ ${(b.gx / b.n).toFixed(1)}, ${(b.gy / b.n).toFixed(1)}, ${(b.gz / b.n).toFixed(1)} (avg)` : "";
    lines.push(`${k}: ∫alpha ${f(b.ia)}  ∫beta ${f(b.ib)}  ∫gamma ${f(b.ig)}  (n ${b.nr})${end}`);
  }
  const sp = bucket("spin");
  if (sp.h0 !== null) lines.push(`compass during spin: ${sp.h0.toFixed(0)} -> ${sp.h1.toFixed(0)}`);
  lines.push(`interval: ${fl.ints.join(", ")}`);
  lines.push(navigator.userAgent.replace(/^Mozilla\/5\.0 /, ""));
  $("out").textContent = lines.join("\n");
});
</script>
</body>
</html>
